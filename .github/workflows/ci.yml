name: CI - Train and Test

on:
  push:
    branches: [ dev, main, docker_cicd ]   # runs for pushes; you can restrict to dev if desired

jobs:
  check_working_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training
        run: |
          python train.py

      - name: Run tests (compute accuracy)
        run: |
          python test.py
